<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Scraper</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-void:#0a0a0f;
  --bg-surface:#111118;
  --bg-card:#16161f;
  --bg-elevated:#1c1c28;
  --bg-input:#0e0e16;
  --border:#2a2a3a;
  --border-focus:#5b5bff;
  --text-primary:#e8e8f0;
  --text-secondary:#8888a0;
  --text-muted:#555570;
  --accent:#6c5ce7;
  --accent-light:#a29bfe;
  --accent-glow:rgba(108,92,231,0.15);
  --green:#00d2a0;
  --green-bg:rgba(0,210,160,0.08);
  --red:#ff6b7a;
  --red-bg:rgba(255,107,122,0.08);
  --amber:#ffc56d;
  --amber-bg:rgba(255,197,109,0.08);
  --blue:#5eb5ff;
  --blue-bg:rgba(94,181,255,0.08);
  --font-body:'DM Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --radius:10px;
  --radius-sm:6px;
  --radius-lg:14px;
}
html{background:var(--bg-void);color:var(--text-primary);font-family:var(--font-body)}
body{min-height:100vh;overflow-x:hidden}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
input,select,textarea,button{font-family:inherit;font-size:inherit}

.app{display:flex;height:100vh}

/* Sidebar */
.sidebar{width:260px;background:var(--bg-surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-logo{padding:24px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-logo svg{width:28px;height:28px}
.sidebar-logo span{font-size:17px;font-weight:700;letter-spacing:-0.5px}
.sidebar-logo small{font-size:10px;color:var(--text-muted);font-weight:500;margin-left:4px;padding:2px 6px;background:var(--bg-elevated);border-radius:4px}
.sidebar-nav{flex:1;padding:16px 12px;overflow-y:auto}
.nav-section{font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.2px;padding:12px 10px 8px;margin-top:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text-secondary);transition:all .15s;margin-bottom:2px}
.nav-item:hover{background:var(--bg-elevated);color:var(--text-primary)}
.nav-item.active{background:var(--accent-glow);color:var(--accent-light);font-weight:500}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.6}
.nav-item.active svg{opacity:1}
.project-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-running{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot-completed{background:var(--blue)}
.dot-idle{background:var(--text-muted)}
.dot-failed{background:var(--red)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:16px;flex-shrink:0;background:var(--bg-surface)}
.topbar-title{font-size:15px;font-weight:600;flex:1}
.topbar-btn{padding:7px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;font-size:12px;font-weight:500;transition:all .15s;display:flex;align-items:center;gap:6px}
.topbar-btn:hover{background:var(--bg-elevated);color:var(--text-primary);border-color:var(--text-muted)}
.topbar-btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.topbar-btn-primary:hover{background:#5b4bd6;border-color:#5b4bd6}
.topbar-btn-danger{border-color:var(--red);color:var(--red)}
.topbar-btn-danger:hover{background:var(--red-bg)}

.content{flex:1;overflow-y:auto;padding:28px}

/* Cards */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;transition:all .2s;cursor:pointer}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.card-title{font-size:15px;font-weight:600;line-height:1.3}
.card-badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px}
.badge-running{background:var(--green-bg);color:var(--green)}
.badge-completed{background:var(--blue-bg);color:var(--blue)}
.badge-idle{background:var(--bg-elevated);color:var(--text-muted)}
.badge-failed{background:var(--red-bg);color:var(--red)}
.card-query{font-size:12px;color:var(--text-secondary);margin-bottom:14px;line-height:1.5}
.card-stats{display:flex;gap:20px}
.card-stat{font-size:11px;color:var(--text-muted)}
.card-stat b{color:var(--text-secondary);font-weight:500}

/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center}
.empty-icon{width:64px;height:64px;border-radius:50%;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.empty h3{font-size:18px;font-weight:600;margin-bottom:8px}
.empty p{font-size:13px;color:var(--text-muted);max-width:340px}

/* Form */
.form-group{margin-bottom:20px}
.form-label{font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.5px}
.form-input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-input);color:var(--text-primary);font-size:14px;outline:none;transition:border .15s}
.form-input:focus{border-color:var(--border-focus)}
.form-input::placeholder{color:var(--text-muted)}
select.form-input{cursor:pointer}
.form-hint{font-size:11px;color:var(--text-muted);margin-top:4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.schema-rows{display:flex;flex-direction:column;gap:8px}
.schema-row{display:grid;grid-template-columns:1fr 120px 32px;gap:8px;align-items:center}
.schema-row input,.schema-row select{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-input);color:var(--text-primary);font-size:13px;outline:none}
.schema-row input:focus,.schema-row select:focus{border-color:var(--border-focus)}
.schema-remove{width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--red);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.schema-remove:hover{background:var(--red-bg)}
.schema-add{padding:8px;border:1px dashed var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--text-muted);cursor:pointer;font-size:12px;width:100%;text-align:center;transition:all .15s}
.schema-add:hover{border-color:var(--accent);color:var(--accent-light);background:var(--accent-glow)}

/* Live view */
.live-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;height:100%}
.live-panel{display:flex;flex-direction:column;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.live-panel-header{padding:12px 16px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.live-panel-count{font-size:11px;font-weight:500;color:var(--text-muted);padding:2px 8px;background:var(--bg-elevated);border-radius:4px}

/* Terminal */
.terminal{flex:1;overflow-y:auto;padding:14px;font-family:var(--font-mono);font-size:11.5px;line-height:1.8;background:var(--bg-void)}
.log-line{display:flex;gap:8px;padding:1px 0}
.log-time{color:var(--text-muted);flex-shrink:0;min-width:60px}
.log-msg{color:var(--text-secondary);word-break:break-all}
.log-msg.log-data{color:var(--green)}
.log-msg.log-error{color:var(--red)}
.log-msg.log-status{color:var(--amber)}

/* Data table */
.data-table-wrap{flex:1;overflow:auto;padding:2px}
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{position:sticky;top:0;background:var(--bg-elevated);padding:10px 12px;text-align:left;font-weight:600;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);z-index:1}
.data-table td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text-secondary);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.data-table tr:hover td{background:var(--bg-elevated);color:var(--text-primary)}

/* Stats bar */
.stats-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat-chip{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius)}
.stat-value{font-size:18px;font-weight:700;font-family:var(--font-mono)}
.stat-label{font-size:11px;color:var(--text-muted)}
.stat-chip.green .stat-value{color:var(--green)}
.stat-chip.blue .stat-value{color:var(--blue)}
.stat-chip.amber .stat-value{color:var(--amber)}
.stat-chip.purple .stat-value{color:var(--accent-light)}

/* Responsive */
@media(max-width:900px){
  .sidebar{display:none}
  .live-layout{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const API = 'http://localhost:8000';

// ─── Icons ───────────────────────────────────────────────
const Icons = {
  spider: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 9V3M12 15v6M9 12H3M15 12h6M7.05 7.05 2.1 2.1M16.95 7.05l4.95-4.95M7.05 16.95l-4.95 4.95M16.95 16.95l4.95 4.95"/></svg>,
  plus: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M5 12h14"/></svg>,
  play: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="5,3 19,12 5,21"/></svg>,
  stop: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>,
  download: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3v12M5 12l7 7 7-7M5 20h14"/></svg>,
  folder: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>,
  home: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h3a1 1 0 001-1V10"/></svg>,
  terminal: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="4,17 10,11 4,5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>,
  back: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>,
  x: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>,
};

// ─── API helpers ─────────────────────────────────────────
async function api(path, opts = {}) {
  const res = await fetch(`${API}${path}`, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ─── Dashboard ───────────────────────────────────────────
function Dashboard({ projects, onSelect, onNew, onRefresh }) {
  return (
    <>
      <div className="topbar">
        <span className="topbar-title">Projects</span>
        <button className="topbar-btn" onClick={onRefresh}>Refresh</button>
        <button className="topbar-btn topbar-btn-primary" onClick={onNew}>
          <Icons.plus /> New project
        </button>
      </div>
      <div className="content">
        {projects.length === 0 ? (
          <div className="empty">
            <div className="empty-icon"><Icons.spider /></div>
            <h3>No projects yet</h3>
            <p>Create your first AI-powered scraping project to get started.</p>
          </div>
        ) : (
          <div className="cards-grid">
            {projects.map(p => (
              <div key={p.id} className="card" onClick={() => onSelect(p)}>
                <div className="card-header">
                  <div className="card-title">{p.name}</div>
                  <span className={`card-badge badge-${p.status}`}>{p.status}</span>
                </div>
                <div className="card-query">{p.query}</div>
                <div className="card-stats">
                  <span className="card-stat"><b>{p.total_items}</b> items</span>
                  <span className="card-stat">{p.mode}</span>
                  <span className="card-stat">Depth {p.max_depth || 3}</span>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </>
  );
}

// ─── New Project Form ────────────────────────────────────
function NewProject({ onCreated, onCancel }) {
  const [name, setName] = useState('');
  const [query, setQuery] = useState('');
  const [mode, setMode] = useState('TEXT_ONLY');
  const [depth, setDepth] = useState(3);
  const [schema, setSchema] = useState([
    { name: 'product_name', type: 'string' },
    { name: 'price', type: 'string' },
  ]);
  const [loading, setLoading] = useState(false);

  const addField = () => setSchema([...schema, { name: '', type: 'string' }]);
  const removeField = (i) => setSchema(schema.filter((_, idx) => idx !== i));
  const updateField = (i, key, val) => {
    const copy = [...schema];
    copy[i] = { ...copy[i], [key]: val };
    setSchema(copy);
  };

  const submit = async () => {
    if (!name || !query || schema.length === 0) return;
    setLoading(true);
    try {
      const schema_def = {};
      schema.forEach(f => { if (f.name) schema_def[f.name] = f.type; });
      const proj = await api('/api/projects', {
        method: 'POST',
        body: JSON.stringify({ name, query, mode, schema_def, max_depth: depth }),
      });
      onCreated(proj);
    } catch (e) {
      alert('Failed: ' + e.message);
    }
    setLoading(false);
  };

  return (
    <>
      <div className="topbar">
        <button className="topbar-btn" onClick={onCancel}><Icons.back /> Back</button>
        <span className="topbar-title">New project</span>
        <button className="topbar-btn topbar-btn-primary" onClick={submit} disabled={loading}>
          {loading ? 'Creating...' : 'Create project'}
        </button>
      </div>
      <div className="content" style={{ maxWidth: 640 }}>
        <div className="form-group">
          <label className="form-label">Project name</label>
          <input className="form-input" placeholder="e.g. GPU Price Tracker" value={name} onChange={e => setName(e.target.value)} />
        </div>
        <div className="form-group">
          <label className="form-label">Search query</label>
          <input className="form-input" placeholder="e.g. NVIDIA RTX 4090 prices specifications" value={query} onChange={e => setQuery(e.target.value)} />
          <div className="form-hint">This is what the crawler searches for on DuckDuckGo to find seed URLs</div>
        </div>
        <div className="form-row">
          <div className="form-group">
            <label className="form-label">Extraction mode</label>
            <select className="form-input" value={mode} onChange={e => setMode(e.target.value)}>
              <option value="TEXT_ONLY">Text Only (fast)</option>
              <option value="SINGLE_IMAGE">Single Image (vision)</option>
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">Max depth</label>
            <input className="form-input" type="number" min="1" max="10" value={depth} onChange={e => setDepth(parseInt(e.target.value) || 3)} />
          </div>
        </div>
        <div className="form-group">
          <label className="form-label">Data schema — fields to extract</label>
          <div className="schema-rows">
            {schema.map((f, i) => (
              <div key={i} className="schema-row">
                <input placeholder="Field name" value={f.name} onChange={e => updateField(i, 'name', e.target.value)} />
                <select value={f.type} onChange={e => updateField(i, 'type', e.target.value)}>
                  <option value="string">String</option>
                  <option value="number">Number</option>
                  <option value="integer">Integer</option>
                  <option value="boolean">Boolean</option>
                  <option value="list">List</option>
                  <option value="url">URL</option>
                </select>
                <button className="schema-remove" onClick={() => removeField(i)}>×</button>
              </div>
            ))}
            <button className="schema-add" onClick={addField}>+ Add field</button>
          </div>
        </div>
      </div>
    </>
  );
}

// ─── Project View (Live Crawl) ───────────────────────────
function ProjectView({ project, onBack, onRefresh }) {
  const [logs, setLogs] = useState([]);
  const [results, setResults] = useState([]);
  const [stats, setStats] = useState(null);
  const [status, setStatus] = useState(project.status);
  const termRef = useRef(null);
  const wsRef = useRef(null);

  // Fetch results on mount
  useEffect(() => {
    api(`/api/projects/${project.id}/results`).then(setResults).catch(() => {});
  }, [project.id]);

  // Poll stats
  useEffect(() => {
    const interval = setInterval(() => {
      api(`/api/projects/${project.id}/stats`).then(setStats).catch(() => {});
    }, 2000);
    return () => clearInterval(interval);
  }, [project.id]);

  // WebSocket connection
  useEffect(() => {
    if (status !== 'running' && status !== 'starting') return;

    const ws = new WebSocket(`ws://localhost:8000/ws/${project.id}`);
    wsRef.current = ws;

    ws.onopen = () => {
      ws.send(JSON.stringify({ last_event_id: 0 }));
      addLog('system', 'WebSocket connected');
    };

    ws.onmessage = (evt) => {
      try {
        const data = JSON.parse(evt.data);
        if (data.type === 'log') {
          addLog('log', data.payload);
        } else if (data.type === 'data') {
          addLog('data', 'Extracted: ' + JSON.stringify(data.payload));
          setResults(prev => [...prev, { data: data.payload, url: data.url, id: Date.now() }]);
        } else if (data.type === 'error') {
          addLog('error', data.payload);
        } else if (data.type === 'status') {
          setStatus(data.payload);
          addLog('status', 'Status: ' + data.payload);
          if (data.payload === 'completed' || data.payload === 'failed' || data.payload === 'stopped') {
            onRefresh();
          }
        }
      } catch {}
    };

    ws.onclose = () => addLog('system', 'WebSocket disconnected');

    return () => { ws.close(); };
  }, [status, project.id]);

  // Auto-scroll terminal
  useEffect(() => {
    if (termRef.current) termRef.current.scrollTop = termRef.current.scrollHeight;
  }, [logs]);

  const addLog = useCallback((type, msg) => {
    const time = new Date().toLocaleTimeString('en-US', { hour12: false }).slice(0, 8);
    setLogs(prev => [...prev.slice(-500), { time, type, msg }]);
  }, []);

  const startCrawl = async () => {
    try {
      await api(`/api/projects/${project.id}/start`, { method: 'POST' });
      setStatus('starting');
      addLog('status', 'Crawl starting...');
    } catch (e) {
      addLog('error', 'Start failed: ' + e.message);
    }
  };

  const stopCrawl = async () => {
    try {
      await api(`/api/projects/${project.id}/stop`, { method: 'POST' });
      setStatus('stopped');
    } catch (e) {
      addLog('error', 'Stop failed: ' + e.message);
    }
  };

  const exportCSV = () => {
    window.open(`${API}/api/projects/${project.id}/export/csv`, '_blank');
  };

  const exportJSON = () => {
    const blob = new Blob([JSON.stringify(results.map(r => r.data), null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${project.name.replace(/\s+/g,'_')}_results.json`;
    a.click(); URL.revokeObjectURL(url);
  };

  // Get unique columns from results
  const columns = [...new Set(results.flatMap(r => Object.keys(r.data || {})))];

  const isActive = status === 'running' || status === 'starting';

  return (
    <>
      <div className="topbar">
        <button className="topbar-btn" onClick={onBack}><Icons.back /> Projects</button>
        <span className="topbar-title">{project.name}</span>
        <span className={`card-badge badge-${status}`}>{status}</span>
        <div style={{ flex: 1 }} />
        {!isActive && <button className="topbar-btn topbar-btn-primary" onClick={startCrawl}><Icons.play /> Start</button>}
        {isActive && <button className="topbar-btn topbar-btn-danger" onClick={stopCrawl}><Icons.stop /> Stop</button>}
        <button className="topbar-btn" onClick={exportCSV}><Icons.download /> CSV</button>
        <button className="topbar-btn" onClick={exportJSON}><Icons.download /> JSON</button>
      </div>

      <div className="content" style={{ padding: '16px 20px', display: 'flex', flexDirection: 'column', gap: 16, height: 'calc(100vh - 56px)' }}>
        {/* Stats bar */}
        <div className="stats-bar">
          <div className="stat-chip green">
            <div><div className="stat-value">{stats?.total_items ?? results.length}</div><div className="stat-label">Items extracted</div></div>
          </div>
          <div className="stat-chip blue">
            <div><div className="stat-value">{stats?.pages_processed ?? 0}</div><div className="stat-label">Pages crawled</div></div>
          </div>
          <div className="stat-chip amber">
            <div><div className="stat-value">{stats?.frontier_size ?? 0}</div><div className="stat-label">URLs queued</div></div>
          </div>
          <div className="stat-chip purple">
            <div><div className="stat-value">{stats?.visited_count ?? 0}</div><div className="stat-label">URLs visited</div></div>
          </div>
        </div>

        {/* Terminal + Data table split */}
        <div className="live-layout" style={{ flex: 1, minHeight: 0 }}>
          <div className="live-panel">
            <div className="live-panel-header">
              <span><Icons.terminal style={{ display: 'inline', width: 14, height: 14, verticalAlign: -2, marginRight: 6 }} />Live terminal</span>
              <span className="live-panel-count">{logs.length} lines</span>
            </div>
            <div className="terminal" ref={termRef}>
              {logs.map((l, i) => (
                <div key={i} className="log-line">
                  <span className="log-time">{l.time}</span>
                  <span className={`log-msg log-${l.type}`}>{l.msg}</span>
                </div>
              ))}
              {logs.length === 0 && (
                <div style={{ color: 'var(--text-muted)', padding: '20px 0' }}>
                  {isActive ? 'Connecting to crawl stream...' : 'Click "Start" to begin crawling'}
                </div>
              )}
            </div>
          </div>

          <div className="live-panel">
            <div className="live-panel-header">
              <span>Extracted data</span>
              <span className="live-panel-count">{results.length} rows</span>
            </div>
            <div className="data-table-wrap">
              {results.length > 0 ? (
                <table className="data-table">
                  <thead>
                    <tr>
                      <th>#</th>
                      {columns.map(c => <th key={c}>{c}</th>)}
                      <th>Source</th>
                    </tr>
                  </thead>
                  <tbody>
                    {results.map((r, i) => (
                      <tr key={r.id || i}>
                        <td style={{ color: 'var(--text-muted)' }}>{i + 1}</td>
                        {columns.map(c => <td key={c} title={String(r.data?.[c] ?? '')}>{String(r.data?.[c] ?? '—')}</td>)}
                        <td title={r.url} style={{ maxWidth: 140 }}>{r.url ? new URL(r.url).hostname : '—'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              ) : (
                <div style={{ padding: 40, textAlign: 'center', color: 'var(--text-muted)', fontSize: 13 }}>
                  {isActive ? 'Waiting for data...' : 'No data extracted yet'}
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

// ─── App Shell ───────────────────────────────────────────
function App() {
  const [view, setView] = useState('dashboard');
  const [projects, setProjects] = useState([]);
  const [selected, setSelected] = useState(null);

  const fetchProjects = useCallback(async () => {
    try {
      const data = await api('/api/projects');
      setProjects(data);
    } catch (e) {
      console.error('Failed to fetch projects:', e);
    }
  }, []);

  useEffect(() => { fetchProjects(); }, []);

  // Auto-refresh running projects
  useEffect(() => {
    const hasRunning = projects.some(p => p.status === 'running');
    if (!hasRunning) return;
    const interval = setInterval(fetchProjects, 5000);
    return () => clearInterval(interval);
  }, [projects]);

  const selectProject = (p) => { setSelected(p); setView('project'); };

  return (
    <div className="app">
      {/* Sidebar */}
      <div className="sidebar">
        <div className="sidebar-logo">
          <Icons.spider />
          <span>AI Scraper<small>v2</small></span>
        </div>
        <nav className="sidebar-nav">
          <div className="nav-section">Navigation</div>
          <div className={`nav-item ${view === 'dashboard' ? 'active' : ''}`} onClick={() => setView('dashboard')}>
            <Icons.home /> Dashboard
          </div>
          <div className={`nav-item ${view === 'new' ? 'active' : ''}`} onClick={() => setView('new')}>
            <Icons.plus /> New project
          </div>

          {projects.length > 0 && <div className="nav-section">Projects</div>}
          {projects.map(p => (
            <div key={p.id} className={`nav-item ${view === 'project' && selected?.id === p.id ? 'active' : ''}`}
                 onClick={() => selectProject(p)}>
              <span className={`project-dot dot-${p.status}`} />
              <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.name}</span>
            </div>
          ))}
        </nav>
      </div>

      {/* Main panel */}
      <div className="main">
        {view === 'dashboard' && (
          <Dashboard
            projects={projects}
            onSelect={selectProject}
            onNew={() => setView('new')}
            onRefresh={fetchProjects}
          />
        )}
        {view === 'new' && (
          <NewProject
            onCreated={(p) => { setProjects(prev => [p, ...prev]); selectProject(p); }}
            onCancel={() => setView('dashboard')}
          />
        )}
        {view === 'project' && selected && (
          <ProjectView
            project={selected}
            onBack={() => { setView('dashboard'); fetchProjects(); }}
            onRefresh={fetchProjects}
          />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
